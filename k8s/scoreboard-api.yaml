apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoreboard-api
  namespace: kratix-demo
  labels:
    app: scoreboard-api
    app.kubernetes.io/name: scoreboard-api
    app.kubernetes.io/part-of: nba-platform
    app.kubernetes.io/managed-by: manual
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scoreboard-api
  template:
    metadata:
      labels:
        app: scoreboard-api
        app.kubernetes.io/name: scoreboard-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: scoreboard-api
          image: kratix-demo/scoreboard-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: STATS_SERVICE_URL
              value: "http://stats-service:8080"
            - name: SCHEDULE_SERVICE_URL
              value: "http://schedule-service:8080"
            - name: APP_VERSION
              value: "1.0.0"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: scoreboard-api
  namespace: kratix-demo
  labels:
    app: scoreboard-api
    app.kubernetes.io/name: scoreboard-api
    app.kubernetes.io/managed-by: manual
spec:
  selector:
    app: scoreboard-api
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
