apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: broken-pipeline
  labels:
    demo: kratix-in-action
    scenario: troubleshooting
  annotations:
    description: "🔥 BROKEN — Pipeline container image does not exist"
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: brokenpipelines.demo.kratix.io
    spec:
      group: demo.kratix.io
      names:
        kind: BrokenPipeline
        plural: brokenpipelines
        singular: brokenpipeline
      scope: Namespaced
      versions:
        - name: v1alpha1
          served: true
          storage: true
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  properties:
                    name:
                      type: string
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: configure
            namespace: kratix-demo
          spec:
            containers:
              - name: generate-resources
                image: kratix-demo/this-image-does-not-exist:v999
                imagePullPolicy: Never
